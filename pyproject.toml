[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "autobrowser-client"
version = "0.1.0"
description = "Python client for browser automation through CLI scripts and HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "patchright>=1.50,<2.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "anyio>=4.0,<5.0",
  "pytest-anyio>=0.0.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
autobrowser = "autobrowser_client.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["autobrowser_client"]
