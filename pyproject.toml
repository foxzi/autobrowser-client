[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "autobrowser-client"
version = "0.5.2"
description = "Python client for browser automation through CLI scripts and HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162,<1.0",
  "mcp>=2.3,<3.0",
  "patchright>=1.64,<2.0",
  "pydantic>=2.14,<3.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.27,<1.0",
  "uvicorn>=0.54,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
  "anyio>=4.15,<5.0",
  "pytest-anyio>=0.0.0",
  "httpx>=0.28,<1.0",
]
cloak = ["cloakbrowser[geoip]>=0.6"]

[project.scripts]
autobrowser = "autobrowser_client.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["autobrowser_client"]

[tool.hatch.build.targets.wheel.force-include]
"skills/autobrowser/SKILL.md" = "autobrowser_client/skill/SKILL.md"
