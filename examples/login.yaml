session:
  headless: true
  profile: test1
  userAgent: Mozilla/5.0
  timeout: 10000

steps:
  - action: open
    url: https://example.com/login

  # String shorthand form
  - action: fill
    locator: "name=username"
    value: demo-user

  - action: fill
    locator: "name=password"
    value: demo-password

  - action: click
    locator: "css=button[type='submit']"

  # Dict form (backward-compatible)
  - action: wait
    waitUntil: networkidle

  - action: get-content
    format: html

output:
  file: result.html
