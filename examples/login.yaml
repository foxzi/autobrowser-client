# Form fill example using httpbin.org/forms/post (pizza order demo form).
# Replace URL and selectors for a real login page.
#
# Run: autobrowser run-script --file examples/login.yaml

session:
  headless: true
  timeout: 10000

steps:
  - action: open
    url: https://httpbin.org/forms/post

  - action: wait
    waitUntil: load

  - action: fill
    locator:
      type: name
      value: custname
    value: Demo User

  - action: fill
    locator:
      type: name
      value: custemail
    value: demo@example.com

  - action: fill
    locator:
      type: name
      value: comments
    value: No special requests.

  - action: click
    locator:
      type: css
      value: "button[type='submit']"

  - action: wait
    waitUntil: load
    timeout: 10000

  - action: get-content
    format: text

output:
  file: output/login_result.txt
