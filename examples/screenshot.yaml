# Full-page screenshot of a page.
# Bot detection test: https://fingerprintjs.github.io/BotD/main/
#
# Output:
#   output/botd.png  - full-page screenshot

session:
  headless: true
  viewport:
    width: 1920
    height: 1080

steps:
  - action: open
    url: https://fingerprintjs.github.io/BotD/main/

  - action: wait
    waitUntil: networkidle
    timeout: 15000

  - action: screenshot
    file: output/botd.png
    fullPage: true

stopOnError: true
