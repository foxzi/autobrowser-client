# Google search in a saved profile (for example one logged in to Google).
# The screenshot is taken in "finally", so it is saved even when the search fails.
#
# Run:
#   autobrowser run-script --file examples/google-search.yaml -p youtube
#   autobrowser run-script --file examples/google-search.yaml -p youtube \
#     --proxy socks5://127.0.0.1:1080 --var "query=autobrowser github"
#
# Output:
#   output/google-search.png - screenshot at the end of the scenario
#   output/google-search.txt - top results as text (title and URL)
#   step "results" in the JSON result - logged-in state, top results
#   a captcha / block page fails the scenario (the screenshot is still taken)

session:
  headless: true
  viewport:
    width: 1920
    height: 1080

vars:
  query: playwright stealth browser

steps:
  - try:
      - open: https://www.google.com/

      # Cookie consent (EU IPs): "Accept all" if it is shown
      - action: evaluate
        script: |
          async () => {
            await new Promise(r => setTimeout(r, 1500));
            const b = [...document.querySelectorAll('button')]
              .find(x => /accept all|hyväksy kaikki|alle akzeptieren|принять все/i.test(x.innerText));
            if (b) { b.click(); await new Promise(r => setTimeout(r, 1500)); }
          }

      - action: type
        locator: "textarea[name='q'], input[name='q']"
        value: "${query}"
      - press: Enter

      # Results (index 0) or a captcha / block page (index 1-3), whichever comes first
      - wait:
          any:
            - exists: "#search a h3"
            - urlMatches: "/sorry/"
            - exists: "#captcha-form"
            - exists: "iframe[src*='recaptcha']"
        timeout: 20000
        as: gate

      - if: {var: gate, equals: 0}
        then:
          - action: evaluate
            as: results
            script: |
              () => {
                const items = [...document.querySelectorAll('#search a:has(h3)')].slice(0, 10)
                  .map(a => ({title: a.querySelector('h3').innerText, url: a.href}));
                return {
                  url: location.href,
                  logged_in: !!document.querySelector('a[href*="SignOutOptions"], a[aria-label*="Google Account"], a[aria-label*="Аккаунт Google"]'),
                  items,
                  text: items.map((x, i) => (i + 1) + '. ' + x.title + '\n   ' + x.url).join('\n') + '\n',
                };
              }
          - action: save
            file: output/google-search.txt
            value: "${results.text}"
        else:
          - fail: "captcha or block page for ${query}"
    finally:
      - action: screenshot
        file: output/google-search.png
