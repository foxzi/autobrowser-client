<!doctype html>
<html><head><title>Aria basic</title></head>
<body>
<nav aria-label="Main"><a href="/home">Home</a> <a href="#about">About us</a></nav>
<h1>Welcome: "quoted" text</h1>
<h2>Second level</h2>
<p>Some paragraph with <b>bold</b> and <a href="https://example.com/x?a=1">a link</a>.</p>
<form>
  <label for="name">Name</label> <input id="name" placeholder="Your name">
  <input type="email" aria-label="Email" value="a@b.c">
  <label><input type="checkbox" checked> Subscribe</label>
  <label><input type="radio" name="r" value="1"> One</label>
  <label><input type="radio" name="r" value="2" checked> Two</label>
  <select aria-label="Color"><option>Red</option><option selected>Green</option></select>
  <textarea aria-label="Notes">line1
line2</textarea>
  <button type="button" disabled>Disabled</button>
  <button type="button" aria-pressed="true">Toggle</button>
  <button type="button" aria-expanded="true">Menu</button>
</form>
<ul><li>First</li><li>Second <i>item</i></li><li>- dash</li></ul>
<table><tr><th>Col A</th><th>Col B</th></tr><tr><td>1</td><td>yes</td></tr></table>
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Pixel">
<div style="display:none">Hidden text</div>
<div aria-hidden="true">Aria hidden</div>
<details><summary>More</summary><p>Inside</p></details>
<div role="tablist"><div role="tab" aria-selected="true">Tab 1</div><div role="tab">Tab 2</div></div>
<div style="cursor:pointer" onclick="1">Clickable div</div>
<input type="range" aria-label="Volume" value="30">
<p>   </p>
<p>#hash: value</p>
</body></html>
