name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binary:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-amd64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-14, name: macos-arm64 }
          - { os: windows-latest, name: windows-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build single-file binary
        shell: bash
        run: |
          ./scripts/build-binary.sh
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          out="autobrowser-${{ matrix.name }}$ext"
          mv "dist/autobrowser$ext" "$out"
          "./$out" version
          python -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()+'  '+sys.argv[1])" "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: autobrowser-${{ matrix.name }}*

  release:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version v$version"
            exit 1
          fi

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from commits since previous tag
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --pretty='- %s' "${prev:+$prev..}$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
