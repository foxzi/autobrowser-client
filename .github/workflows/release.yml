name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binary:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-amd64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-14, name: macos-arm64 }
          - { os: windows-latest, name: windows-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build single-file binary
        shell: bash
        working-directory: python
        run: |
          ./scripts/build-binary.sh
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          out="autobrowser-${{ matrix.name }}$ext"
          mv "dist/autobrowser$ext" "$out"
          "./$out" version
          python -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()+'  '+sys.argv[1])" "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: python/autobrowser-${{ matrix.name }}*

  go-binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Build static binary
        working-directory: go
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          out="autobrowser-go-$GOOS-$GOARCH$ext"
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X github.com/foxzi/autobrowser-client/go/internal/cli.Version=$version" -o "$out" ./cmd/autobrowser
          if [ "$GOOS-$GOARCH" = "linux-amd64" ]; then
            [ "$(./"$out" version)" = "$version" ]
          fi
          sha256sum "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: go/autobrowser-go-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    needs: [binary, go-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version v$version"
            exit 1
          fi

      - name: Build wheel and sdist
        working-directory: python
        run: |
          python -m pip install build
          python -m build

      - uses: actions/download-artifact@v4
        with:
          path: python/dist
          merge-multiple: true

      - name: Release notes from commits since previous tag
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --pretty='- %s' "${prev:+$prev..}$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" python/dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
