name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,cloak]"

      - name: Test
        # Tests that need a real browser binary are excluded
        run: >
          pytest -q
          --ignore=tests/test_engine_browser.py
          --deselect tests/test_mcp_server.py::test_mcp_browser_flow
          --deselect tests/test_mcp_server.py::test_mcp_run_script

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...
